# Cloudflare Worker that loads feeds and article pages for the web app (see README.md).
name = "rss-reader-feeds"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true
send_metrics = false

# Nothing is logged: no request logs, no traces.
[observability]
enabled = false

[vars]
# The web app's address(es); change to yours. Local development is allowed by default.
ALLOWED_ORIGINS = "https://rss-reader.pages.dev,http://localhost:5173"

# 120 requests per minute per IP address (a full refresh of 100 feeds fits).
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 120, period = 60 }
