<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Save to Content</title>
    <style>
      body { font: 14px system-ui, sans-serif; margin: 0; padding: 14px; width: 260px; color: #1c1b1f; }
      h1 { font-size: 15px; margin: 0 0 6px; }
      p { margin: 0 0 12px; color: #49454f; overflow-wrap: anywhere; }
      button { width: 100%; padding: 9px 12px; border: 0; border-radius: 20px; background: #6750a4; color: #fff; font: inherit; cursor: pointer; }
      button:disabled { background: #cac4d0; cursor: default; }
      @media (prefers-color-scheme: dark) {
        body { background: #1c1b1f; color: #e6e1e5; }
        p { color: #cac4d0; }
        button { background: #d0bcff; color: #381e72; }
      }
    </style>
  </head>
  <body>
    <h1 id="title">Save to Content</h1>
    <p id="page"></p>
    <button id="save" disabled>Save to Content</button>
    <script src="popup.js"></script>
  </body>
</html>
